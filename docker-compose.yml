services:
  mongodb:
    image: mongo:latest
    container_name: nexlib-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    container_name: nexlib-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/librarypassword
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

volumes:
  mongo_data:
  neo4j_data:

